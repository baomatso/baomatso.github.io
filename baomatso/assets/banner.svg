<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 650" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Baomatso gaming safety banner</title>
  <desc id="banner-desc">Vietnamese gamer, digital game screen, privacy shield and access controls in a blue ocean-inspired scene</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a49"/>
      <stop offset=".48" stop-color="#075a78"/>
      <stop offset="1" stop-color="#082a4c"/>
    </linearGradient>
    <linearGradient id="copy-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#041e39" stop-opacity=".58"/>
      <stop offset=".6" stop-color="#062a49" stop-opacity=".16"/>
      <stop offset="1" stop-color="#062a49" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d7e9"/>
      <stop offset="1" stop-color="#1674b8"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a93b9"/>
      <stop offset="1" stop-color="#15366c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#abffff"/>
      <stop offset=".48" stop-color="#4bd8f2"/>
      <stop offset="1" stop-color="#2789db"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#55e6f5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#55e6f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#9aefff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-.3" y="-.3" width="1.7" height="1.8">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03152d" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1800" height="650" fill="url(#ocean)"/>
  <rect width="1800" height="650" fill="url(#grid)" opacity=".32"/>
  <ellipse cx="1430" cy="305" rx="510" ry="380" fill="url(#aura)"/>
  <rect width="1800" height="650" fill="url(#copy-shade)"/>

  <g fill="none" stroke="#79eafa" stroke-linecap="round">
    <path d="M0 555c225-78 368 39 566-5 178-40 266-146 472-101 166 36 243 145 397 112 113-24 220-99 365-78" stroke-opacity=".25" stroke-width="3"/>
    <path d="M0 595c226-60 365 41 570 3 191-35 272-113 458-77 171 34 261 119 416 88 129-25 232-79 356-62" stroke-opacity=".19" stroke-width="2"/>
    <path d="M1060 40c150-70 373-35 490 46 98 68 149 179 207 254" stroke-opacity=".2" stroke-width="2"/>
  </g>
  <g fill="#d6fbff">
    <circle cx="965" cy="130" r="3" opacity=".72"/><circle cx="1110" cy="82" r="2" opacity=".55"/>
    <circle cx="1512" cy="72" r="3" opacity=".68"/><circle cx="1718" cy="178" r="2" opacity=".6"/>
    <circle cx="1095" cy="395" r="2" opacity=".7"/><circle cx="1740" cy="434" r="3" opacity=".7"/>
    <circle cx="1550" cy="565" r="2" opacity=".6"/><circle cx="1240" cy="102" r="2" opacity=".6"/>
  </g>

  <!-- holographic privacy shield -->
  <g transform="translate(1510 93)" filter="url(#soft-glow)">
    <circle cx="104" cy="108" r="143" fill="none" stroke="#77efff" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="104" cy="108" r="124" fill="none" stroke="#77efff" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="7 12"/>
    <path d="M104 5 194 38v67c0 69-36 112-90 145-54-33-90-76-90-145V38z" fill="#0a4d78" fill-opacity=".8" stroke="url(#shield)" stroke-width="8"/>
    <path d="m66 108 26 27 54-60" fill="none" stroke="#dcffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 19v215" stroke="#bcfbff" stroke-opacity=".15" stroke-width="2"/>
  </g>

  <!-- floating permission controls -->
  <g transform="translate(1048 386)" filter="url(#shadow)">
    <rect width="230" height="145" rx="20" fill="#0a3456" fill-opacity=".92" stroke="#6fe7f6" stroke-opacity=".7" stroke-width="2"/>
    <rect x="20" y="24" width="39" height="39" rx="12" fill="#1a8fb0"/>
    <path d="M31 44h17m-8-8v17" stroke="#e5ffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="76" y="30" width="95" height="7" rx="4" fill="#d7faff" opacity=".9"/>
    <rect x="76" y="46" width="66" height="5" rx="3" fill="#a1deea" opacity=".6"/>
    <rect x="20" y="88" width="39" height="39" rx="12" fill="#244d86"/>
    <circle cx="39" cy="107" r="9" fill="#d6fbff"/>
    <rect x="76" y="94" width="95" height="7" rx="4" fill="#d7faff" opacity=".85"/>
    <rect x="76" y="110" width="66" height="5" rx="3" fill="#a1deea" opacity=".55"/>
    <rect x="178" y="33" width="34" height="18" rx="9" fill="#34c7db"/>
    <circle cx="202" cy="42" r="7" fill="#efffff"/>
    <rect x="178" y="97" width="34" height="18" rx="9" fill="#32758f"/>
    <circle cx="187" cy="106" r="7" fill="#efffff"/>
  </g>

  <!-- gamer and desktop setup -->
  <g filter="url(#shadow)">
    <path d="M1180 627c17-135 60-221 163-249 85-23 162 10 202 86 24 44 37 101 42 163z" fill="url(#jacket)" stroke="#5edbef" stroke-opacity=".58" stroke-width="3"/>
    <path d="M1264 398c20-53 54-78 98-78 43 0 78 25 98 78l-29 92h-139z" fill="#112d58"/>
    <path d="M1301 209c5-62 48-103 111-103 65 0 108 48 108 116 0 78-46 131-112 131-66 0-111-58-107-144z" fill="#d69a7c"/>
    <path d="M1301 224c-19-82 22-141 91-152 69-10 126 26 136 93-29-20-50-37-73-62-37 40-91 58-154 59z" fill="#15213f"/>
    <path d="M1288 214c-5-76 37-138 105-151 76-15 141 27 149 105" fill="none" stroke="#43d1e9" stroke-width="12" stroke-linecap="round"/>
    <path d="M1289 205c-23 1-34 21-31 49 3 27 18 43 40 40m235-78c23 0 35 19 33 47-2 28-17 45-40 43" fill="#153c68" stroke="#58dcf0" stroke-width="7"/>
    <path d="M1362 356v54c22 27 71 30 98 0v-62" fill="#c8876f"/>
    <path d="M1312 457c53 27 124 28 183-1" fill="none" stroke="#72ebf6" stroke-opacity=".75" stroke-width="5"/>
    <path d="M1386 391c-20 30-31 64-31 103m77-104c21 30 32 64 31 103" fill="none" stroke="#4dcde5" stroke-opacity=".62" stroke-width="4"/>
  </g>

  <!-- gaming monitor -->
  <g filter="url(#shadow)">
    <path d="M1515 288h231c15 0 27 12 27 27v151h-285V315c0-15 12-27 27-27z" fill="#071c38" stroke="#75e9f4" stroke-width="4"/>
    <rect x="1510" y="300" width="238" height="150" rx="12" fill="url(#screen)"/>
    <path d="M1510 405c43-42 75-48 112-19 33-48 74-61 126-13v77h-238z" fill="#0d6194" opacity=".82"/>
    <path d="M1510 422c50-24 88-23 127 3 38-23 74-22 111-3v28h-238z" fill="#123e78" opacity=".92"/>
    <circle cx="1630" cy="351" r="22" fill="#fff0b7" opacity=".95"/>
    <path d="M1607 490h47v25h-47z" fill="#235a83"/>
    <path d="M1570 519h120" stroke="#78e5f1" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- controller and desk -->
  <path d="M1120 570c-9-25 8-46 35-51l77-12c19-3 31 5 39 19l13 22 18-3 11-22c8-15 21-22 39-19l78 14c28 5 43 27 34 52l-10 31c-7 21-31 31-50 18l-39-25-142 1-38 25c-20 13-43 2-50-20z" fill="#123a69" stroke="#68dff0" stroke-width="4"/>
  <path d="M1180 549h47m-23-23v47" stroke="#c9fbff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1421" cy="542" r="8" fill="#ffe18d"/><circle cx="1448" cy="558" r="8" fill="#ff9ca8"/>
  <path d="M1010 629h760" stroke="#65dceb" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
</svg>
